version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: angeltalk-mongo
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: angel_talk
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7.2-alpine
    container_name: angeltalk-redis
    restart: always
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./angel-talk-backend
      dockerfile: Dockerfile
    container_name: angeltalk-backend
    restart: always
    ports:
      - "4000:4000"
    # Secrets (MONGO_URI, JWT secrets, admin password…) come from angel-talk-backend/.env, which is not in git
    env_file:
      - ./angel-talk-backend/.env
    environment:
      NODE_ENV: production
      PORT: 4000
      REDIS_URL: redis://redis:6379
    depends_on:
      - mongodb
      - redis

volumes:
  mongo_data:

